name: QuantLab CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "landing/**"
      - "desktop/docs/**"
      - "docs/**/*.png"
      - "docs/**/*.jpg"
      - "docs/**/*.jpeg"
      - "docs/**/*.webp"
      - "landing/**/*.png"
      - "landing/**/*.jpg"
      - "landing/**/*.jpeg"
      - "landing/**/*.webp"
      - "desktop/docs/**/*.png"
      - "desktop/docs/**/*.jpg"
      - "desktop/docs/**/*.jpeg"
      - "desktop/docs/**/*.webp"
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "landing/**"
      - "desktop/docs/**"
      - "docs/**/*.png"
      - "docs/**/*.jpg"
      - "docs/**/*.jpeg"
      - "docs/**/*.webp"
      - "landing/**/*.png"
      - "landing/**/*.jpg"
      - "landing/**/*.jpeg"
      - "landing/**/*.webp"
      - "desktop/docs/**/*.png"
      - "desktop/docs/**/*.jpg"
      - "desktop/docs/**/*.jpeg"
      - "desktop/docs/**/*.webp"

concurrency:
  group: quantlab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install numba

      - name: Run tests
        run: |
          python -m pytest -q

  hardening-gate-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m pip install numba

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test hardening gate runner
        run: python -m pytest test/test_hardening_gate_runner.py -q

      - name: Execute live-freeze gate
        if: ${{ !cancelled() }}
        run: python scripts/verify_hardening_gate.py wave0.live_execution_freeze

      - name: Execute Python baseline gate
        if: ${{ !cancelled() }}
        run: python scripts/verify_hardening_gate.py wave0_5.python_suite_baseline

      - name: Execute Desktop Node-test gate
        if: ${{ !cancelled() }}
        run: python scripts/verify_hardening_gate.py wave0_5.node_tests

      - name: Execute Desktop typecheck gate
        if: ${{ !cancelled() }}
        run: python scripts/verify_hardening_gate.py wave0_5.desktop_typecheck

      - name: Execute Desktop build gate
        if: ${{ !cancelled() }}
        run: python scripts/verify_hardening_gate.py wave0_5.desktop_build

      - name: Upload hardening evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hardening-evidence-${{ github.sha }}
          path: outputs/hardening/**
          if-no-files-found: error
          retention-days: 30

  desktop-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: TypeScript strict-mode check
        working-directory: desktop
        run: npm run typecheck

  desktop-real-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm ci

      - name: Run desktop real-path smoke
        working-directory: desktop
        run: |
          xvfb-run -a npm run smoke:real-path

  desktop-react-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop fallback smoke
        working-directory: desktop
        run: xvfb-run -a npm run smoke:fallback
